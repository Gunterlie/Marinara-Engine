name: Static demo Pages trial

on:
  push:
    branches: [feat/static-demo-tutorial]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Upstream line to rebuild the website on (current = this branch as pushed)"
        type: choice
        options: [current, main, staging]
        default: current
      prepared_branch:
        description: "Reviewed candidate branch on this fork (website-refresh/...); needs source_ref=current. Empty = this branch"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: static-demo-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Gunterlie/Marinara-Engine' && github.ref == 'refs/heads/feat/static-demo-tutorial'
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'current' }}
      PREPARED_BRANCH: ${{ inputs.prepared_branch }}
    steps:
      # Values reach the shell only through env. A candidate must sit under website-refresh/ and have been reviewed before publication.
      - name: Validate inputs
        run: |
          [ -z "$PREPARED_BRANCH" ] && exit 0
          [ "$SOURCE_REF" = current ] || { echo "prepared_branch needs source_ref=current"; exit 1; }
          case "$PREPARED_BRANCH" in *..*|*//*|*/|*.lock) echo "bad prepared_branch"; exit 1;; esac
          [[ "$PREPARED_BRANCH" =~ ^website-refresh/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "prepared_branch must match website-refresh/<name>"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.prepared_branch && format('refs/heads/{0}', inputs.prepared_branch) || '' }}
          fetch-depth: 0 # the overlay is found as base..HEAD
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Replays the website overlay onto upstream main/staging. A conflict fails the job: nothing deploys, the old site stays.
      - name: Prepare source
        id: prep
        run: |
          if [ "$SOURCE_REF" = current ]; then
            echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          else
            node scripts/demo/refresh.mjs prepare --source "$SOURCE_REF" --dir "$RUNNER_TEMP/website-refresh"
            echo "dir=$RUNNER_TEMP/website-refresh" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.prep.outputs.dir }}
      - run: pnpm build:demo
        working-directory: ${{ steps.prep.outputs.dir }}
        env:
          MARINARA_DEMO_BASE: /Marinara-Engine/
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ${{ steps.prep.outputs.dir }}
      - run: pnpm smoke:demo
        working-directory: ${{ steps.prep.outputs.dir }}
      # Provenance beside demo-build.json: source line, exact upstream commit, overlay commits, prepared head.
      - name: Record source
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          if [ "$SOURCE_REF" = current ]; then CURRENT="--source current"; else CURRENT=""; fi
          node scripts/demo/refresh.mjs finish --dir . --out packages/client/dist-demo/website-source.json $CURRENT
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.prep.outputs.dir }}/packages/client/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy trial
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
