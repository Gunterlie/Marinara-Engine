name: Static demo Pages

on:
  # Daily: rebuild onto the latest upstream release when it is newer than the deployed site.
  # GitHub runs schedules only from the default branch, so this file must also be on that branch (WEBSITE-REBUILD.md).
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [feat/static-demo-tutorial, main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Upstream line to rebuild the website on (current = this branch as pushed, release = latest upstream release, always rebuilt)"
        type: choice
        options: [current, release, main, staging]
        default: current
      prepared_branch:
        description: "Reviewed candidate branch on this fork (website-refresh/...); needs source_ref=current. Empty = this branch"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: static-demo-pages
  cancel-in-progress: false

jobs:
  # Finds the latest upstream release and skips the build when the site already shows it.
  release:
    if: contains(fromJSON('["Gunterlie/Marinara-Engine","Pasta-Devs/Marinara-Website"]'), github.repository) && (github.event_name == 'schedule' || inputs.source_ref == 'release')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      build: ${{ steps.latest.outputs.build }}
    steps:
      - name: Compare the latest release with the deployed site
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          tag=$(gh api repos/Pasta-Devs/Marinara-Engine/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected release tag '$tag'"; exit 1; }
          # A missing file or a site built from a branch has no releaseTag, so the release is built.
          deployed=$(curl -fsSL "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/website-source.json" | jq -r '.releaseTag // empty') || deployed=""
          if [ "$FORCED" = true ] || [ "$tag" != "$deployed" ]; then build=true; else build=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Latest release $tag, deployed ${deployed:-no release}, forced $FORCED, build $build." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: release
    if: >-
      !cancelled() && contains(fromJSON('["Gunterlie/Marinara-Engine","Pasta-Devs/Marinara-Website"]'), github.repository) &&
      (github.ref == 'refs/heads/feat/static-demo-tutorial' || github.ref == 'refs/heads/main' || github.event_name == 'schedule') &&
      (needs.release.result == 'skipped' || needs.release.outputs.build == 'true')
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ (github.event_name == 'schedule' && 'release') || inputs.source_ref || 'current' }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      PREPARED_BRANCH: ${{ inputs.prepared_branch }}
    steps:
      # Values reach the shell only through env. A candidate must sit under website-refresh/ and have been reviewed before publication.
      - name: Validate inputs
        run: |
          [ -z "$PREPARED_BRANCH" ] && exit 0
          [ "$SOURCE_REF" = current ] || { echo "prepared_branch needs source_ref=current"; exit 1; }
          case "$PREPARED_BRANCH" in *..*|*//*|*/|*.lock) echo "bad prepared_branch"; exit 1;; esac
          [[ "$PREPARED_BRANCH" =~ ^website-refresh/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "prepared_branch must match website-refresh/<name>"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.prepared_branch && format('refs/heads/{0}', inputs.prepared_branch) || (github.event_name == 'schedule' && format('refs/heads/{0}', github.event.repository.default_branch || github.ref_name)) || '' }}
          fetch-depth: 0 # the overlay is found as base..HEAD
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Replays the website overlay onto upstream main/staging. A conflict fails the job: nothing deploys, the old site stays.
      - name: Prepare source
        id: prep
        run: |
          if [ "$SOURCE_REF" = current ]; then
            echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          else
            node scripts/demo/refresh.mjs prepare --source "$SOURCE_REF" ${RELEASE_TAG:+--tag "$RELEASE_TAG"} --dir "$RUNNER_TEMP/website-refresh"
            echo "dir=$RUNNER_TEMP/website-refresh" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.prep.outputs.dir }}
      # Pages serves the site under /<repo name>/; github.event.repository is empty on schedule runs.
      - run: MARINARA_DEMO_BASE="/${GITHUB_REPOSITORY#*/}/" pnpm build:demo
        working-directory: ${{ steps.prep.outputs.dir }}
      - name: Check the site against docs, assets, locale keys and versions
        id: check
        run: node scripts/demo/check-site.mjs ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
        working-directory: ${{ steps.prep.outputs.dir }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ${{ steps.prep.outputs.dir }}
      - name: Smoke test
        id: smoke
        run: pnpm smoke:demo
        working-directory: ${{ steps.prep.outputs.dir }}
      # Provenance beside demo-build.json: source line, exact upstream commit, overlay commits, prepared head.
      - name: Record source
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          if [ "$SOURCE_REF" = current ]; then CURRENT="--source current"; else CURRENT=""; fi
          node scripts/demo/refresh.mjs finish --dir . --out packages/client/dist-demo/website-source.json $CURRENT
      - name: Job summary
        if: always()
        env:
          DIR: ${{ steps.prep.outputs.dir }}
          CHECK: ${{ steps.check.outcome || 'not run' }}
          SMOKE: ${{ steps.smoke.outcome || 'not run' }}
        run: |
          meta="$DIR/packages/client/dist-demo/website-source.json"
          [ -f "$meta" ] || meta="$RUNNER_TEMP/website-refresh.meta.json"
          {
            echo "### Website build"
            echo "- Source: $SOURCE_REF"
            echo "- Release tag: ${RELEASE_TAG:-none}"
            if [ -f "$meta" ]; then
              jq -r '"- Upstream commit: \(.sourceSha // "this branch as pushed")",
                "- Overlay commits: \(.overlayCommits // [] | length) after \(.overlayBase // "none")",
                "- Built head: \(.preparedHead // "not finished")"' "$meta"
            fi
            echo "- Site check: $CHECK"
            echo "- Smoke test: $SMOKE"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.prep.outputs.dir }}/packages/client/dist-demo

  deploy:
    needs: build
    # Explicit, because a skipped release job would otherwise skip this job too.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy trial
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Job summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "- Deployed: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"

  # Publishes the deployed site as a site-* release so a web server can pull it (scripts/demo/pull-site.sh).
  # A failure here never touches the Pages deploy.
  site-release:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages
          path: artifact
      - name: Publish site release
        run: |
          mkdir site
          tar -xf artifact/artifact.tar -C site
          version=$(jq -r .version site/demo-build.json)
          head=$(jq -r .preparedHead site/website-source.json)
          name="website-$version-${head::7}"
          tag="site-$version-${head::7}"
          tar -czf "$name.tar.gz" -C site .
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cp site/website-source.json .
          gh release create "$tag" "$name.tar.gz" "$name.tar.gz.sha256" website-source.json \
            --target "$GITHUB_SHA" --title "$tag" --latest=false \
            --notes "Built website for Marinara Engine $version. Install it with scripts/demo/pull-site.sh."
          echo "- Site release: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the 5 newest site releases
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("site-"))] | sort_by(.created_at) | reverse | .[5:] | .[].tag_name' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
